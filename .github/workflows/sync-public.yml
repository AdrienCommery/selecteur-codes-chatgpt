name: Sync public release

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-public.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4
        with:
          path: public

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: AdrienCommery/-1000-commandes-chatgpt
          ref: main
          path: source

      - name: Copy release files
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p public/api public/public public/data
          cp source/api/index.js public/api/index.js
          cp source/public/widget.html public/public/widget.html
          cp source/data/commands_fr.jsonl public/data/commands_fr.jsonl
          cp source/package.json public/package.json
          cp source/package-lock.json public/package-lock.json
          cp source/vercel.json public/vercel.json
          cp source/server.js public/server.js

      - name: Verify no secrets are copied
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/public"
          if find . -type f \( -name '.env' -o -name '.env.local' -o -name '.env.production' \) | grep -q .; then
            echo 'A forbidden .env file was found.'
            exit 1
          fi
          if grep -RIl --exclude='README.md' --exclude='.env.example' --exclude='sync-public.yml' 'sk-proj-' . | grep -q .; then
            echo 'A possible OpenAI API key was detected.'
            exit 1
          fi

      - name: Commit synchronized files
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/public"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/index.js public/widget.html data/commands_fr.jsonl package.json package-lock.json vercel.json server.js
          if git diff --cached --quiet; then
            echo 'Public release already up to date.'
            exit 0
          fi
          git commit -m 'Sync public release from production'
          git push
